<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baseball Stat Quiz — Can You Name the Player?</title>
    <meta name="description" content="Test your baseball knowledge! Given a career stat, can you pick the right player? Hitters and pitchers from 2000+.">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="stats-container">
        <div class="streak-container">
            Streak: <span id="streak-counter">0</span>
        </div>
        <div class="lives-container" id="lives-container">
            <svg class="heart" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            <svg class="heart" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            <svg class="heart" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        </div>
    </div>
    <div class="card">
        <div id="loading">Loading players...</div>
        <div id="game-area" style="display: none;">

            <!-- ── Baseball Field SVG ── -->
            <svg class="field-svg" id="field-svg" viewBox="0 0 300 240" xmlns="http://www.w3.org/2000/svg">
                <!-- Outfield arc (fan shape) -->
                <path d="M150,220 L30,110 A170,170 0 0,1 270,110 Z" fill="#2d8a2d" stroke="#1a1a1a" stroke-width="3"/>
                <!-- Dirt infield diamond -->
                <polygon points="150,200 80,130 150,60 220,130" fill="#d4a032" stroke="#1a1a1a" stroke-width="2.5"/>
                <!-- Infield grass -->
                <polygon points="150,185 95,130 150,75 205,130" fill="#2d8a2d" stroke="#1a1a1a" stroke-width="1.5"/>
                <!-- Baselines -->
                <line x1="150" y1="200" x2="220" y2="130" stroke="#1a1a1a" stroke-width="2"/>
                <line x1="220" y1="130" x2="150" y2="60" stroke="#1a1a1a" stroke-width="2"/>
                <line x1="150" y1="60" x2="80" y2="130" stroke="#1a1a1a" stroke-width="2"/>
                <line x1="80" y1="130" x2="150" y2="200" stroke="#1a1a1a" stroke-width="2"/>
                <!-- Pitcher's mound -->
                <circle cx="150" cy="130" r="10" fill="#d4a032" stroke="#1a1a1a" stroke-width="1.5"/>
                <!-- 2nd Base (top) -->
                <rect x="145" y="55" width="10" height="10" transform="rotate(45 150 60)" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/>
                <!-- 3rd Base (left) -->
                <rect x="75" y="125" width="10" height="10" transform="rotate(45 80 130)" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/>
                <!-- 1st Base (right) -->
                <rect x="215" y="125" width="10" height="10" transform="rotate(45 220 130)" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/>
                <!-- Home Plate (pentagon) -->
                <polygon points="150,205 144,199 144,193 156,193 156,199" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/>

                <!-- Batter icon (streak=0) -->
                <g id="batter-icon" transform="translate(150, 195)">
                    <!-- Head -->
                    <circle cx="0" cy="-20" r="5" fill="#f0c090" stroke="#1a1a1a" stroke-width="1"/>
                    <!-- Helmet -->
                    <path d="M-5,-25 A5,5 0 0,1 5,-25 L5,-22 L-5,-22 Z" fill="#1e40af" stroke="#1a1a1a" stroke-width="0.8"/>
                    <!-- Body -->
                    <line x1="0" y1="-15" x2="0" y2="-3" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
                    <!-- Front leg (planted) -->
                    <line x1="0" y1="-3" x2="-5" y2="7" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
                    <!-- Back leg (stance) -->
                    <line x1="0" y1="-3" x2="5" y2="7" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
                    <!-- Front arm (holding bat) -->
                    <line x1="0" y1="-12" x2="-6" y2="-8" stroke="#f0c090" stroke-width="2" stroke-linecap="round"/>
                    <!-- Back arm (holding bat high) -->
                    <line x1="0" y1="-12" x2="4" y2="-18" stroke="#f0c090" stroke-width="2" stroke-linecap="round"/>
                    <!-- Bat -->
                    <line x1="-6" y1="-8" x2="6" y2="-28" stroke="#8B4513" stroke-width="2.5" stroke-linecap="round"/>
                </g>

                <!-- Runner icon (streak=1-3, hidden by default) -->
                <g id="runner-icon" style="display:none;">
                    <!-- Head -->
                    <circle cx="0" cy="-20" r="5" fill="#f0c090" stroke="#1a1a1a" stroke-width="1"/>
                    <!-- Helmet -->
                    <path d="M-5,-25 A5,5 0 0,1 5,-25 L5,-22 L-5,-22 Z" fill="#1e40af" stroke="#1a1a1a" stroke-width="0.8"/>
                    <!-- Body (leaning forward) -->
                    <line x1="0" y1="-15" x2="4" y2="-3" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
                    <!-- Front leg (extended forward) -->
                    <line x1="4" y1="-3" x2="10" y2="7" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
                    <!-- Back leg (pushing off) -->
                    <line x1="4" y1="-3" x2="-5" y2="5" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
                    <!-- Front arm (pumping forward) -->
                    <line x1="1" y1="-12" x2="8" y2="-8" stroke="#f0c090" stroke-width="2" stroke-linecap="round"/>
                    <!-- Back arm (pumping back) -->
                    <line x1="1" y1="-12" x2="-6" y2="-6" stroke="#f0c090" stroke-width="2" stroke-linecap="round"/>
                </g>
            </svg>

            <!-- ── Question Row (pitcher throws ball, text trails) ── -->
            <div class="question-row" id="question-row">
                <!-- Inline pitcher icon -->
                <svg class="pitcher-icon" viewBox="0 0 24 28" xmlns="http://www.w3.org/2000/svg">
                    <!-- Head -->
                    <circle cx="10" cy="5" r="4" fill="#f0c090" stroke="#1a1a1a" stroke-width="0.8"/>
                    <!-- Cap -->
                    <path d="M6,3 A4,4 0 0,1 14,3 L14,4.5 L6,4.5 Z" fill="#1e40af" stroke="#1a1a1a" stroke-width="0.6"/>
                    <!-- Body -->
                    <line x1="10" y1="9" x2="10" y2="18" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
                    <!-- Throwing arm -->
                    <line x1="10" y1="11" x2="19" y2="7" stroke="#f0c090" stroke-width="2" stroke-linecap="round"/>
                    <!-- Glove arm -->
                    <line x1="10" y1="13" x2="3" y2="16" stroke="#f0c090" stroke-width="2" stroke-linecap="round"/>
                    <circle cx="2" cy="17" r="2" fill="#8B4513"/>
                    <!-- Front leg -->
                    <line x1="10" y1="18" x2="6" y2="26" stroke="#1e3a5f" stroke-width="2" stroke-linecap="round"/>
                    <!-- Back leg -->
                    <line x1="10" y1="18" x2="15" y2="25" stroke="#1e3a5f" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <div class="text-and-ball">
                    <span class="question-text" id="question-text"></span>
                    <!-- Ball icon that leads the text -->
                    <svg class="ball-icon" id="ball-icon" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="10" cy="10" r="9" fill="#f5f5f0" stroke="#cc0000" stroke-width="1.5"/>
                        <path d="M6,4 Q3,10 6,16" stroke="#cc0000" stroke-width="1" fill="none"/>
                        <path d="M14,4 Q17,10 14,16" stroke="#cc0000" stroke-width="1" fill="none"/>
                    </svg>
                </div>
            </div>

            <div id="options-container" class="options-grid"></div>
            <div id="feedback" class="feedback hidden"></div>
            <button id="next-btn" class="hidden">Next Question &#10132;</button>
        </div>
    </div>

    <div id="win-screen" class="win-overlay hidden">
        <div class="win-card">
            <h1>HOME RUN!</h1>
            <p>You got 4 in a row! You win!</p>
            <button id="reset-game-btn">Play Again</button>
            <button id="keep-playing-btn" class="secondary-btn">Keep Playing</button>
        </div>
    </div>

    <div id="lose-screen" class="win-overlay hidden">
        <div class="lose-card">
            <h1 class="strikeout-text">STRIKE THREE!</h1>
            <p id="lose-message"></p>
            <button id="lose-reset-btn">Try Again</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
