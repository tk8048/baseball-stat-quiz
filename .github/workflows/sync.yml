name: Daily Stats Sync
on:
  schedule:
    - cron: '0 0 * * *' # Runs at midnight UTC daily
  workflow_dispatch:   # Allows you to trigger it manually

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all history so it can merge/rebase correctly

      - name: Set up Python
        uses: actions/setup-python@v4

      - name: Run Update Script
        run: python3 update_players.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add players.json
          git commit -m "Auto-update players stats [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push
